# Harness Workflow — VeOmni 模型迁移闭环
#
# 全流程可修改迁移代码、在获得授权后运行训练、精度校验和性能调优。
# JSON/YAML 是阶段门禁和可追溯证据；面向人的最终报告只有两份 Markdown。

name: "veomni-onboarding"
version: "0.2.0"
description: "VeOmni 昇腾 NPU 模型迁移闭环：代码适配、训练验证、精度校验、性能调优；最终仅交付覆盖报告与过程记录"

task_states: [PENDING, RUNNING, PASSED, FAILED, BLOCKED, NEEDS_HUMAN]

agents:
  veomni-orchestrator:
    plugin: "veomni-agent"
    entry: "veomni-orchestrator"
    role: "编排调度"
    description: "维护阶段门禁，汇总内部证据，生成两份最终交付件"
  veomni-adaptation:
    plugin: "veomni-agent"
    entry: "veomni-adaptation-agent"
    role: "模型适配"
    description: "环境检查、模型分析、代码适配和并行策略"
  veomni-validation:
    plugin: "veomni-agent"
    entry: "veomni-validation-agent"
    role: "验证"
    description: "功能验证、训练执行、精度对齐和回归"
  veomni-performance:
    plugin: "veomni-agent"
    entry: "veomni-performance-agent"
    role: "性能优化"
    description: "MFU 计算、Profiling、性能调优和精度复测"

pipeline:
  - stage: environment
    agent: veomni-adaptation
    depends_on: []
    input: [{source: user, as: requirement}]
    output: [environment_report.json]
    gate:
      - {file: environment_report.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/environment_report.json"}
    prompt: |
      调用 veomni-npu-environment 检查实际训练环境。允许执行只读检查；安装或变更环境前必须取得授权。
      仅写内部证据 environment_report.json，不生成面向人的阶段报告。
      结束时输出 `→ handoff: ENVIRONMENT_DONE`；不兼容时输出 `→ handoff: ENVIRONMENT_BLOCKED`。

  - stage: model-analysis
    agent: veomni-adaptation
    depends_on: [environment]
    precondition: [{file: environment_report.json, source: environment}]
    output: [model_inventory.json]
    gate:
      - {file: model_inventory.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/model_inventory.json"}
    prompt: |
      调用 veomni-model-analysis，盘点 dataset、dataloader、model、config 及权重、处理器、Trainer、注册入口。
      将映射、风险和缺口写入 model_inventory.json，作为后续实现和最终覆盖报告的证据。
      结束时输出 `→ handoff: ANALYSIS_DONE`；缺少 NPU 算子时输出 `→ handoff: ANALYSIS_HANDOFF_OPS`。

  - stage: adaptation
    agent: veomni-adaptation
    depends_on: [model-analysis]
    precondition: [{file: model_inventory.json, source: model-analysis}]
    output: [patch_manifest.json]
    gate:
      - {file: patch_manifest.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/patch_manifest.json"}
      - {generated_files_untouched: true}
    prompt: |
      调用 veomni-model-adaptation，实际修改 VeOmni 工作副本、Patchgen 配置、注册、dataset/dataloader、model、config 和 Trainer 接入。
      Flux DiT SFT 还必须按 veomni-model-adaptation/references/flux-sft-training-readiness.md
      执行配置、权重加载、列表 forward 和图像条件预处理改动及回归验证。
      在获得授权后可运行加载、前向和最小训练。generated modeling 文件只能由 Patchgen 生成。
      将改动文件、训练配置、命令和结果写入 patch_manifest.json；不要生成阶段 Markdown 报告。
      结束时输出 `→ handoff: ADAPTATION_DONE`。

  - stage: functional-validation
    agent: veomni-validation
    depends_on: [adaptation]
    precondition: [{file: patch_manifest.json, source: adaptation}]
    output: [functional_report.json]
    gate:
      - {file: functional_report.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/functional_report.json"}
    prompt: |
      执行最小构建、加载、前向、反向和 checkpoint 验证；训练执行需要遵守授权边界。
      将命令、日志证据、状态和失败原因写入 functional_report.json，不生成阶段 Markdown 报告。
      结束时输出 `→ handoff: FUNCTIONAL_DONE`；失败时输出 `→ handoff: FUNCTIONAL_FAILED`。

  - stage: parallel-recipe
    agent: veomni-adaptation
    depends_on: [functional-validation]
    output: [parallel_recipe.yaml]
    gate:
      - {file: parallel_recipe.yaml, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/parallel_recipe.json"}
    prompt: |
      调用 veomni-parallel-recipe，为目标模型生成并验证 FSDP2、Ulysses SP、EP 等实际可用配置。
      将候选选择依据写入 parallel_recipe.yaml；授权后可运行单卡/多卡训练验证，不生成阶段 Markdown 报告。
      结束时输出 `→ handoff: PARALLEL_DONE`。

  - stage: precision-alignment
    agent: veomni-validation
    depends_on: [parallel-recipe]
    output: [golden_manifest.json, accuracy_report.json]
    gate:
      - {file: golden_manifest.json, min_bytes: 200}
      - {file: accuracy_report.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/accuracy_report.json"}
    prompt: |
      调用 veomni-precision-alignment，运行 GPU/单卡 NPU/多卡 NPU 的 Golden 和精度比较。
      将输入、种子、阈值、首个差异点和结论写入 golden_manifest.json、accuracy_report.json，不生成阶段 Markdown 报告。
      结束时输出 `→ handoff: PRECISION_DONE`；失败时输出 `→ handoff: PRECISION_FAILED`。

  - stage: mfu-calculation
    agent: veomni-performance
    depends_on: [precision-alignment]
    output: [mfu_report.json]
    gate:
      - {file: mfu_report.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/mfu_report.json"}
    prompt: |
      调用 veomni-mfu-calculation，基于真实训练日志、有效吞吐和芯片峰值计算 MFU；缺少证据时停止而非估算。
      仅写内部证据 mfu_report.json。结束时输出 `→ handoff: MFU_DONE`。

  - stage: performance-tuning
    agent: veomni-performance
    depends_on: [mfu-calculation]
    output: [performance_baseline.json, performance_report.json]
    gate:
      - {file: performance_baseline.json, min_bytes: 200}
      - {file: performance_report.json, min_bytes: 200}
      - {schema: "benchmarks/veomni/schemas/performance_report.json"}
    prompt: |
      调用 veomni-performance-tuning，运行 ProfileConfig、定位瓶颈并实际修改优化项。每次只改变一个主要变量，优化后必须重新执行精度验证。
      将基线、日志证据、优化变量、收益和精度复测结果写入 JSON，不生成阶段 Markdown 报告。
      结束时输出 `→ handoff: PERFORMANCE_DONE`；精度回退时输出 `→ handoff: PRECISION_REGRESSED`。

  - stage: delivery
    agent: veomni-orchestrator
    depends_on: [performance-tuning]
    output: [acceptance_report.json, delivery_coverage_report.md, migration_process_record.md]
    gate:
      - {file: acceptance_report.json, min_bytes: 300}
      - {schema: "benchmarks/veomni/schemas/acceptance_report.json"}
      - {file: delivery_coverage_report.md, min_bytes: 800}
      - {file: migration_process_record.md, min_bytes: 600}
      - command: >-
          python benchmarks/veomni/quick_migration/check_outputs.py
          outputs/{model}/delivery_coverage_report.md
          outputs/{model}/migration_process_record.md
    prompt: |
      汇总所有内部 JSON/YAML 证据与实际代码改动，先生成机器可校验的 acceptance_report.json：
      它必须记录每阶段状态、回归范围、复现命令、限制与结论，并遵循
      benchmarks/veomni/schemas/acceptance_report.json。该文件是内部验收契约，不作为额外的人工报告。
      最终只生成两份面向人的 Markdown：
      1. delivery_coverage_report.md：必须覆盖 dataset、dataloader、model、config，按需覆盖 tokenizer/processor、Trainer/loss、权重/checkpoint、注册入口、并行、训练、精度和性能；逐项写入源/目标证据、改动、验证结果、状态、风险与下一步。
      2. migration_process_record.md：按时间顺序记录环境、分析、改代码、训练、精度校验、性能调优、回归等实际操作，包含命令、版本、日志/产物路径、决策、失败与回退。
      未执行的训练、精度或性能步骤必须如实标为 NOT_RUN/BLOCKED，并说明原因。最终 Markdown 不得宣称未经运行验证的结论。
      结束时输出 `→ handoff: DELIVERY_DONE`。

fallback_edges:
  - {from: environment, to: null, handoff: "ENVIRONMENT_BLOCKED", action: "记录阻塞原因，等待环境授权或修复"}
  - {from: model-analysis, handoff: "ANALYSIS_HANDOFF_OPS", action: "转交 Ops Agent 处理底层算子"}
  - {from: functional-validation, to: adaptation, handoff: "FUNCTIONAL_FAILED"}
  - {from: precision-alignment, to: adaptation, handoff: "PRECISION_FAILED", action: "定位首个差异节点并修复"}
  - {from: performance-tuning, to: precision-alignment, handoff: "PRECISION_REGRESSED"}

execution:
  backend: "auto"
  output:
    base_dir: "outputs/{model}"
    checkpoint: true
  authorized_actions_only: true
