name: mindspeed-scan-issue-agent
version: 4
entry_agent: issue-orchestrator
states:
  - discovered
  - snapshot-ready
  - identity-resolved
  - eligible
  - evidence-ready
  - draft-ready
  - awaiting-one-time-approval
  - pre-publish-recheck
  - posting
  - confirmed
  - pending-delivery
  - retired
  - blocked-read
modes:
  dry-run:
    local_writes: false
    external_writes: false
  shadow:
    local_writes: true
    external_writes: false
  template-auto:
    local_writes: true
    external_writes: guarded
invariants:
  - unknown-membership-blocks-publish
  - maintainer-intervention-retires-automation
  - post-requires-remote-readback
  - repository-policy-required-for-post
  - interactive-post-requires-body-bound-one-time-approval
  - pending-delivery-never-reposts
