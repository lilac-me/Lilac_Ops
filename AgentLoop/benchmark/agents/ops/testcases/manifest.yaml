# ops-dev benchmark case registry (single source of truth)
# =========================================================
# Referenced by plugins/ops/ops.yaml `execution.testcases`.
#
# Each case is a self-contained, deterministic operator spec. The harness runs
# the same `requirement` under a given {harness × model} combo, and `scoring.py`
# turns the resulting `outputs/<id>/` workspace into the five-dimension score.
#
# Fields:
#   id                workspace/outputs/<id> name, kebab-case
#   op                human-readable operator name
#   reference         torch reference implementation used as precision/PERF ground truth
#   kernel_type       VV (vector / element-wise / reduction) or CV (Cube / matmul-like)
#   difficulty        easy | medium | hard | complex  (drives cost budget + workload estimate)
#   dtypes            precision coverage required.
#                     ⚠️ 与 `bench_runs.py` 的 `case_config()` 必须同步：那里硬编码了每个
#                     case 实测哪些 shape × dtype 的输入工厂，而它跑在 NPU 容器里、读不到本
#                     manifest，所以这份重复是结构性的。两边漂移的后果是：required_shapes
#                     里某个形状永远没被测（覆盖率闸门扣分），或 D2 的 deciding 值是在与
#                     声明不同的 dtype 集合上算出来的。
#   target_speedup    acceptance parity vs torch (1.0 == at least match torch latency);
#                     <1.0 means "must be <= 1/target × torch latency"
#   requirement       the one-line requirement text fed to the ops-dev pipeline
#
#   bottleneck_classes  (only on cases we have measured ourselves) the bottleneck
#                     classification(s) that are *factually correct* for this case,
#                     as established by our own profiling + optimisation experiments.
#                     D4 awards its classification points only for a class in this
#                     set — D4 used to award them for any class merely being in the
#                     enum, i.e. it scored the *format* of the answer, not whether
#                     the answer was right (a run that called rmsnorm bandwidth_bound
#                     scored full marks for a claim our own data refutes: rmsnorm got
#                     2.9x faster by restructuring the reduction, so "at the HBM wall,
#                     nothing to do" is wrong, not just differently worded).
#                     Synonyms that mean the same physical thing are all listed, so a
#                     correct answer is never punished for word choice. Cases without
#                     this field fall back to enum-membership and are flagged as such.

version: "1.0"
suite: "ops-dev"
total: 36

# ---------------------------------------------------------------------------
# Tier 1 — 简单（element-wise / 纯向量，无 Cube）: 15 用例
# ---------------------------------------------------------------------------
cases:
  - id: relu
    op: ReLU
    reference: torch.nn.functional.relu
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[4096, 4096], [2048, 8192], [16384, 16384]]
    bottleneck_classes: [memory_bound, bandwidth_bound]   # 实测 1.15 TB/s / 77% HBM，纯访存
    requirement: "生成一个 ReLU 算子，与 torch.nn.functional.relu 逐位一致（含 NaN 透传 / -0.0 保留），memory-bound 场景延迟不慢于 torch 1.2 倍。"

  - id: gelu
    op: GELU
    reference: torch.nn.functional.gelu(x, approximate='tanh')
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[4096, 4096], [2048, 8192], [16384, 16384]]
    bottleneck_classes: [memory_bound, bandwidth_bound]   # 实测 1.29 TB/s / 81% HBM，纯访存
    requirement: "生成一个 GELU 激活算子（tanh 近似，对齐 torch.nn.functional.gelu(x, approximate='tanh')；精确 erf 形式在 Triton tl.erf 下实测比厂商核慢 2.5×，不采用），延迟不慢于 torch 1.2 倍。"

  - id: silu
    op: SiLU
    reference: torch.nn.functional.silu
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 SiLU（x*sigmoid(x)）算子，与 torch.nn.functional.silu 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: sigmoid
    op: Sigmoid
    reference: torch.nn.functional.sigmoid
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Sigmoid 算子，与 torch.sigmoid 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: tanh
    op: Tanh
    reference: torch.nn.functional.tanh
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Tanh 算子，与 torch.tanh 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: add
    op: Add
    reference: torch.add
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个逐元素加法算子，与 torch.add 精度一致（含 broadcast），延迟不慢于 torch 1.2 倍。"

  - id: mul
    op: Multiply
    reference: torch.mul
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个逐元素乘法算子，与 torch.mul 精度一致（含 broadcast），延迟不慢于 torch 1.2 倍。"

  - id: sub
    op: Subtract
    reference: torch.sub
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个逐元素减法算子，与 torch.sub 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: div
    op: Divide
    reference: torch.div
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个逐元素除法算子，与 torch.div 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: sqrt
    op: Sqrt
    reference: torch.sqrt
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Sqrt 算子，与 torch.sqrt 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: exp
    op: Exponential
    reference: torch.exp
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Exp 算子，与 torch.exp 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: abs
    op: Absolute
    reference: torch.abs
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Abs 算子，与 torch.abs 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: neg
    op: Negate
    reference: torch.neg
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Negate 算子，与 torch.neg 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: clamp
    op: Clamp
    reference: torch.clamp
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Clamp 算子（min/max 边界），与 torch.clamp 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: leaky-relu
    op: LeakyReLU
    reference: torch.nn.functional.leaky_relu
    kernel_type: VV
    difficulty: easy
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 LeakyReLU 算子（negative_slope=0.01），与 torch.nn.functional.leaky_relu 精度一致，延迟不慢于 torch 1.2 倍。"

# ---------------------------------------------------------------------------
# Tier 2 — 中等（reduction / 两遍法 / 多算子 fusion）: 10 用例
# ---------------------------------------------------------------------------
  - id: rmsnorm
    op: RMSNorm
    reference: torch.nn.functional.rms_norm
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[4096, 4096], [2048, 8192], [16384, 16384]]
    bottleneck_classes: [reduction_bound]   # 实测：Cube 归约重构拿到 2.9x（285us→99us），
                                            # 所以"已到 HBM 墙、无可优化"是事实错误
    requirement: "生成一个 RMSNorm 算子（两遍法：先算均方根再做归一化），与 torch.nn.functional.rms_norm 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: layernorm
    op: LayerNorm
    reference: torch.nn.functional.layer_norm
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 LayerNorm 算子（含 affine 权重/偏置），与 torch.nn.functional.layer_norm 精度一致，延迟不慢于 torch 1.2 倍。"

  - id: softmax
    op: Softmax
    reference: torch.nn.functional.softmax
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Softmax 算子（沿最后一维，数值稳定三遍法 max/sub/exp 归一），与 torch.nn.functional.softmax 精度一致。"

  - id: mean
    op: Mean
    reference: torch.mean
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Mean 归约算子（支持 dim/keepdim），与 torch.mean 精度一致。"

  - id: sum
    op: Sum
    reference: torch.sum
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Sum 归约算子（支持 dim/keepdim），与 torch.sum 精度一致。"

  - id: variance
    op: Variance
    reference: torch.var
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Variance 算子（unbiased=False），与 torch.var 精度一致。"

  - id: l2-normalize
    op: L2 Normalize
    reference: torch.nn.functional.normalize
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 L2 归一化算子（p=2），与 torch.nn.functional.normalize 精度一致。"

  - id: log-softmax
    op: LogSoftmax
    reference: torch.nn.functional.log_softmax
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 LogSoftmax 算子，与 torch.nn.functional.log_softmax 精度一致。"

  - id: dropout
    op: Dropout
    reference: torch.nn.functional.dropout
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Dropout 算子（train 模式 mask 随机置零 + 缩放，固定 seed），与 torch.nn.functional.dropout 语义一致。"

  - id: batch-norm
    op: BatchNorm
    reference: torch.nn.functional.batch_norm
    kernel_type: VV
    difficulty: medium
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 BatchNorm1d/2d 推理算子，与 torch.nn.functional.batch_norm 精度一致。"

# ---------------------------------------------------------------------------
# Tier 3 — 复杂（Cube / matmul / attention 类）: 8 用例
# ---------------------------------------------------------------------------
  - id: matmul
    op: MatMul
    reference: torch.matmul
    kernel_type: CV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[1024, 1024], [2048, 1024], [4096, 4096]]
    bottleneck_classes: [compute_bound]   # 实测 0.25 TB/s / 16% HBM，瓶颈在 Cube 不在访存
    requirement: "生成一个 MatMul 算子（tiling + autotune），与 torch.matmul 精度一致，性能不慢于 torch。"

  - id: linear
    op: Linear
    reference: torch.nn.functional.linear
    kernel_type: CV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Linear 算子（含 bias），与 torch.nn.functional.linear 精度一致，性能不慢于 torch。"

  - id: bmm
    op: Batch MatMul
    reference: torch.bmm
    kernel_type: CV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Batch MatMul 算子，与 torch.bmm 精度一致，性能不慢于 torch。"

  - id: scaled-dot-product-attention
    op: Scaled Dot-Product Attention
    reference: torch.nn.functional.scaled_dot_product_attention
    kernel_type: CV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[1, 8, 64, 64], [1, 8, 128, 64], [1, 8, 256, 64]]
    bottleneck_classes: [attention_bound]   # 实测 0.12 TB/s / 8% HBM，瓶颈在注意力自身结构
    requirement: "生成一个 Flash-Attention 风格的 scaled_dot_product_attention 算子，与 torch.nn.functional.scaled_dot_product_attention 精度一致。"

  - id: rope
    op: Rotary Position Embedding
    reference: 手工旋转 embedding（cos/sin 表）
    kernel_type: VV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 RoPE（Rotary Position Embedding）算子，支持 q/k 的旋转前向，与参考实现精度一致。"

  - id: swiglu
    op: SwiGLU
    reference: silu(gate) * up
    kernel_type: VV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    required_shapes: [[4096, 4096], [2048, 8192], [16384, 16384]]
    bottleneck_classes: [memory_bound, bandwidth_bound]   # 实测 0.6 TB/s / 38% HBM，访存受限
    requirement: "生成一个融合 SwiGLU 算子（silu(gate) 与 up 相乘，单 kernel），与组合参考精度一致。"

  - id: rmsnorm-matmul
    op: RMSNorm + MatMul fusion
    reference: rms_norm 后接 matmul
    kernel_type: CV
    difficulty: hard
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 RMSNorm+MatMul 融合算子（省一次 GM 往返），与组合参考精度一致。"

  - id: grouped-gemm
    op: Grouped GEMM (MoE)
    reference: 分组 torch.matmul
    kernel_type: CV
    difficulty: hard
    dtypes: [fp16]
    target_speedup: 1.0
    requirement: "生成一个 MoE Grouped GEMM 算子，与分组 torch.matmul 精度一致，性能不慢于等价分组计算。"

# ---------------------------------------------------------------------------
# Tier 4 — 极复杂（多 kernel 流水线 / 多算子 fusion）: 3 用例
# ---------------------------------------------------------------------------
  - id: fused-gelu-add-norm
    op: GELU+Add+LayerNorm fusion
    reference: F.layer_norm(F.gelu(x)+residual)
    kernel_type: VV
    difficulty: complex
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 GELU+Add+LayerNorm 三段 fusion 算子，与组合参考精度一致。"

  - id: multi-head-attention
    op: Multi-Head Attention
    reference: 手工 MHA 前向（QKV+softmax+AV）
    kernel_type: CV
    difficulty: complex
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个完整 Multi-Head Attention 前向算子（QKV 投影 + 缩放点积 + 输出投影），与参考实现精度一致。"

  - id: conv2d
    op: Conv2d
    reference: torch.nn.functional.conv2d
    kernel_type: CV
    difficulty: complex
    dtypes: [fp32, fp16]
    target_speedup: 1.0
    requirement: "生成一个 Conv2d 算子（im2col 或直接卷积 tiling），与 torch.nn.functional.conv2d 精度一致。"