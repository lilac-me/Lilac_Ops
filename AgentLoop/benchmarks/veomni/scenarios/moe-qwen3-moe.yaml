# 首期验收场景 — MoE: Qwen3 MoE
# 层级: CPU/Dry-run + 单卡 NPU + 多卡 NPU（EP 必须）
scenario: moe-qwen3-moe
model: Qwen3-MoE
model_type: moe
priority: P0
trainer: text
parallel:
  fsdp2: true
  ulysses_sp: false
  ep: true
required_checks:
  - expert_routing_consistency      # EP 路由与单卡一致
  - active_vs_total_params_recorded # MoE 报告须区分激活/总参数
stages:
  - environment: {mode: npu, smoke_test: required}
  - model-analysis: {reference_model: qwen3-moe}
  - adaptation: {patchgen: [gpu, npu], tests: [load, forward, train]}
  - functional-validation: {min_steps: 2, checkpoint: true}
  - parallel-recipe: {candidates_min: 2, ep_constraint: "experts %% ep == 0", consistency_check: required}
  - precision-alignment: {pairs: [[gpu, npu_single], [npu_single, npu_multi]]}
  - mfu-calculation: {model_type: moe, routing_assumption_required: true}
  - performance-tuning: {hotspots: [moe_dispatch, moe_combine], precision_rerun: required}
  - delivery: {reports: [acceptance_report.json, delivery_coverage_report.md, migration_process_record.md]}
fixtures:
  config: benchmarks/veomni/fixtures/toy-moe.yaml
