# Toy 训练配置模板（Dense / MoE / VLM / DiT / Omni 通用结构）
# 用途: CPU/Dry-run 与单卡 NPU 功能验证（1-2 step 前反向）
# 占位符 {model} 由适配阶段填充
model:
  name: "{model}"
  dtype: bf16
  seq_len: 128
  hidden_size: 256        # toy: 远小于正式模型
  num_layers: 2
  num_attention_heads: 4

data:
  fixture: benchmarks/veomni/fixtures/minimal-dataset.jsonl
  batch_size: 1
  num_workers: 0

parallel:
  world_size: 1           # toy 阶段单卡
  fsdp2:
    enabled: false        # toy 关闭分片，保证与分布式一致性对比基线纯净

training:
  steps: 2
  optimizer: adamw
  lr: 1.0e-4
  gradient_checkpointing: false

output:
  checkpoint: false       # VLM/MoE/DiT 场景按 scenario 要求开启