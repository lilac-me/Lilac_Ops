# Qwen3-Omni 预览场景的最小单卡冒烟配置。真实执行前必须补齐各模态 manifest。
model:
  name: Qwen3-Omni
  dtype: bf16
  text_seq_len: 128
  audio_tokens: 32
  vision_tokens: 64
  hidden_size: 256
  num_layers: 2
data:
  fixture: benchmarks/veomni/fixtures/minimal-dataset.jsonl
  audio_manifest: REQUIRED_AT_RUNTIME
  image_manifest: REQUIRED_AT_RUNTIME
  batch_size: 1
  num_workers: 0
parallel:
  world_size: 1
  fsdp2: {enabled: false}
training:
  steps: 1
  optimizer: adamw
output:
  checkpoint: false
