# Qwen3 Dense 的 CPU/Dry-run 与单卡 NPU 冒烟配置。
model:
  name: Qwen3
  dtype: bf16
  seq_len: 128
  hidden_size: 256
  num_layers: 2
  num_attention_heads: 4
data:
  fixture: benchmarks/veomni/fixtures/minimal-dataset.jsonl
  batch_size: 1
  num_workers: 0
parallel:
  world_size: 1
  fsdp2: {enabled: false}
training:
  steps: 2
  optimizer: adamw
  lr: 1.0e-4
output:
  checkpoint: false
