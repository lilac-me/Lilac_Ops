# Wan2.1 DiT 的最小视频生成训练冒烟配置。真实执行前必须提供 video_manifest。
model:
  name: Wan2.1
  dtype: bf16
  latent_tokens: 64
  hidden_size: 256
  num_layers: 2
data:
  video_manifest: REQUIRED_AT_RUNTIME
  batch_size: 1
  num_workers: 0
parallel:
  world_size: 1
  fsdp2: {enabled: false}
  ulysses_sp: 1
training:
  steps: 1
  optimizer: adamw
output:
  checkpoint: true
