# Qwen3-MoE 的最小路由与训练冒烟配置。
model:
  name: Qwen3-MoE
  dtype: bf16
  seq_len: 128
  hidden_size: 256
  num_layers: 2
  num_attention_heads: 4
  num_experts: 4
  experts_per_token: 2
data:
  fixture: benchmarks/veomni/fixtures/minimal-dataset.jsonl
  batch_size: 1
  num_workers: 0
parallel:
  world_size: 1
  fsdp2: {enabled: false}
  ep: 1
training:
  steps: 2
  optimizer: adamw
  lr: 1.0e-4
output:
  checkpoint: true
