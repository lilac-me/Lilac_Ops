# TaskKind 任务维度枚举（可扩展）
# =================================
# 用于路由 R2：从用户话术抽 trigger 词 → 任务维度。
# 注意：本表不是运行时硬编码，而是维护者按 AGENTS.md 分类体系演进的路由对照表；
# 每个 TaskKind 的 capability-skills 与 plugins 需与真实 SKILL.md/plugin.json 对账
# （lint 会校验引用的 skill/plugin 名存在）。

task-kinds:
  # 注：本表 `plugins`/`skills` 是任务维度的能力清单；命中 state-machine 插件
  # （plugins.yaml `execution: state-machine`，如 inference-model-optimize）且确需
  # 完整流水线时，路由终点为该插件 workflow 入口（entry_agent），skills 仅作其
  # 各阶段 agent 的知识底座；单点任务仍可直接委派本表 skills 中的单个 skill。
  # 执行形态判定规则见 skills/common/common/ecosystem-routing/SKILL.md R3.1/R3.2。
  - id: perf-optimize
    aliases: [性能优化, 优化性能, 加速, 吞吐, autotune, 寻优, 调优性能]
    trigger_words: [性能, 优化, 加速, 吞吐, 显存, autotune, 寻优, 卡点, 慢, 融合算子]
    description: 训练/推理性能优化、参数与并行策略寻优、算子融合。
    plugins: [mindspeed-agent, inference-model-optimize, ops, veomni-agent]
    skills: [ascend-perf-tuning, vllm-ascend-autotune-zh, mindspeed-llm-fsdp2-main-control, triton-op-dev,
             veomni-performance-tuning, veomni-mfu-calculation, veomni-parallel-recipe]

  - id: migrate
    aliases: [迁移, 适配, 移植, 接入, 新模型, NPU迁移]
    trigger_words: [迁移, 迁到, 迁入, 适配, 移植, 接入, 一键适配, 新模型, 移植到, 迁移到NPU, 迁移到昇腾]
    description: GPU→NPU / 开源 HF 模型 → MindSpeed 系列 / 仓库级迁移适配。
    plugins: [mindspeed-agent, ecosystem-code-repository-npu-migration, veomni-agent]
    skills: [mindspeed-llm-mcore-open-model-migration, fsdp2-model-adaptation, bridge-model-adaptation,
             goal, feature-model, env-setup, repair, veomni-quick-migration, veomni-model-adaptation]

  - id: align
    aliases: [精度对齐, 精度, 对齐, 比对, cosine]
    trigger_words: [精度, 对齐, cosine, 比对, 数值]
    description: GPU→NPU / HF↔MindSpeed 精度对齐与数值校验。
    plugins: [mindspeed-agent, veomni-agent]
    skills: [align-mindspeed-transformers-precision, fsdp2-precision-alignment, bridge-precision-alignment,
             veomni-precision-alignment]

  - id: deploy
    aliases: [部署, 起服务, 安装, 环境]
    trigger_words: [部署, 启动, 起服务, 安装, 环境, 服务, serving, 服务化]
    description: 环境搭建、服务部署、服务生命周期管理。
    plugins: [mindspeed-agent, inference-model-optimize]
    skills: [vllm-ascend-serving, environment-install, bridge-remote-train-run]

  - id: benchmark
    aliases: [压测, 基准, benchmark, 吞吐测试]
    trigger_words: [压测, 基准, 吞吐测试, benchmark]
    description: 性能基准测试（推理/训练）。
    plugins: [inference-model-optimize]
    skills: [vllm-ascend-benchmark, ascend-profiling-collection]

  - id: diagnose
    aliases: [定位, 报错, 二分, 慢卡, profiling 分析, 精度定位, 乱码]
    trigger_words: [定位, 报错, 二分, 慢, 卡死, profiling, 分析 profiling, 版本问题, 乱码, 复读,
                    错 token, 精度异常, dump]
    description: 运行异常定位、版本二分、profiling 数据分析、vLLM-Ascend 推理精度与稳定性分诊。
    plugins: [mindspeed-agent, inference-model-optimize]
    skills: [version-bisect, ascend-msprof-analyze-cli, cann-package-split-diagnose, ascend-perf-tuning,
             dump-debug]

  - id: ops-dev
    aliases: [算子, triton, ascend c, 边界, 生成算子, golden, 标杆, 反向标杆]
    trigger_words: [算子, triton, ascend c, tilelang, 边界, kernel, golden, 标杆, 反向标杆]
    description: 算子需求分析、详设、代码生成、反向 torch 标杆（golden）生成、边界摸排、测试与 profiling。
    plugins: [ops]
    skills: [ops-design, triton-op-dev, ops-bwd-golden, tilelang-design, tilelang-op-dev, ops-test-gen, ops-profiling, ops-boundary-survey,
             profile-bottleneck-analyzer, triton-op-source-assembler, profile-driven-triton-opt]

  - id: doc
    aliases: [资料, 文档, 审资料, 生成文档]
    trigger_words: [资料, 文档, 审, 质量审查, 生成文档]
    description: 仓库资料生成、更新与四维质量审查。
    plugins: [doc-agent]
    skills: [doc-orchestrator, doc-design, doc-generate, doc-update, doc-quality-check]

  - id: validate
    aliases: [验证, 跑测, 远端训练, 门禁]
    trigger_words: [验证, 跑测, 远端, 训练验证, 门禁, loss 精度, 训练场景]
    description: 场景验证、远端训练/推理、回归与精度门禁。
    plugins: [mindspeed-agent]
    skills: [validate-mindspeed-training-scenarios, bridge-feature-validation, bridge-migration-workflow, mindspeed-llm-remote-validation, mindspeed-llm-loss-accuracy-validation]

  - id: issue-triage
    aliases: [Issue 扫描, Issue 分诊, 待回复 Issue, 自动回复, 社区 Issue]
    trigger_words: [Issue, 扫描 Issue, 分诊, 待回复, 回复草稿, GitCode Issue, 小鲁班日报]
    description: 扫描用户指定 GitCode 仓库的 Issue，解析成员身份，生成受控分析和回复草稿。
    plugins: [mindspeed-scan-issue-agent]
    skills: [gitcode-issue-triage]
