# MindSpeed-Agent 插件注册表（Plugin 节点 · v3 按需安装）
# =======================================================
# 图谱事实源之二：本仓 marketplace 插件（unit）+ 与社区仓库的亲缘 + 安装元数据。
# 安装架构见 docs/install-on-demand-design.md（core + 领域 unit 按需安装）。
#
# 规则（lint 强校验，checks_core.py）：
#   - id: 与 marketplace.json / plugin.json 的插件名一致
#   - platforms: 支持的加载平台（claude / codex / dsh）
#   - repo_affinity: 该插件主要处理的社区仓 canonical id（须存在于 repos.yaml）
#   - skills: 该插件聚合的 skill 名（SKILL.md frontmatter name；lint 校验存在性）
#   - install.unit: core（默认安装，唯一）| on-demand（按需安装）
#   - install.default_installed: core 必须 true；on-demand 必须 false
#   - install.skills_root: canonical 技能根（相对仓库根，须真实存在）
#   - install.install_hint: 各平台按需安装命令模板（<unit> 会被替换）
# 维护：新增插件 → 追加；marketplace 插件变化 → 同步本表 + .claude-plugin/marketplace.json。

plugins:
  - id: mindspeed-agent
    name: mindspeed-agent
    display_name: MindSpeed Agent（core · 路由核心）
    description: 核心插件：ecosystem-routing 意图路由 + catalog 知识图谱底座，不随装领域技能。
    platforms: [claude, codex, dsh]
    repo_affinity:
      - mindspeed-llm
      - mindspeed-bridge
      - mindspeed-mm
      - mindspeed
      - vllm-ascend
      - megatron-core
      - cann
      - torch-npu
      - msprobe
      - mstt
    repo_affinity_reason: core 负责跨仓/跨插件意图路由，具备全仓别名消歧能力；通用底座技能处理 CANN 软件栈/工具仓
    skills: [ecosystem-routing]
    workflow: ""
    install:
      unit: core
      default_installed: true
      skills_root: skills/common
      install_hint:
        claude: "claude plugin install mindspeed-agent@MindSpeed-Agent"
        codex: "codex plugin add mindspeed-agent@MindSpeed-Agent"
        dsh: "python tools/install-unit.py dsh mindspeed-agent"

  - id: mindspeed-llm
    name: mindspeed-llm
    display_name: MindSpeed LLM（LLM 训练技能族）
    description: LLM 训练域插件：开源模型迁移 / FSDP2 适配与优化 / 精度对齐 / 训练场景验证。
    platforms: [claude, codex, dsh]
    repo_affinity:
      - mindspeed-llm
      - mindspeed-bridge
      - mindspeed-mm
      - megatron-core
    repo_affinity_reason: llm-skills 全部作用于 MindSpeed-LLM 及其 bridge/mm 迁移与上游 Megatron
    skills:
      - align-mindspeed-transformers-precision
      - bridge-feature-validation
      - bridge-migration-workflow
      - bridge-model-adaptation
      - bridge-precision-alignment
      - bridge-remote-train-run
      - fsdp2-model-adaptation
      - fsdp2-model-analysis
      - fsdp2-precision-alignment
      - llm-model-analysis
      - mindspeed-llm-fsdp2-fused-op-integration
      - mindspeed-llm-fsdp2-main-control
      - mindspeed-llm-loss-accuracy-validation
      - mindspeed-llm-mcore-open-model-migration
      - mindspeed-llm-remote-validation
      - validate-mindspeed-training-scenarios
    workflow: ""
    install:
      unit: on-demand
      default_installed: false
      skills_root: skills/llm-skills
      install_hint:
        claude: "claude plugin install mindspeed-llm@MindSpeed-Agent"
        codex: "codex plugin add mindspeed-llm@MindSpeed-Agent"
        dsh: "python tools/install-unit.py dsh mindspeed-llm"

  - id: inference-model-optimize
    name: inference-model-optimize
    display_name: Inference Model Optimize
    description: 推理模型部署优化插件：architect→developer→tester→reviewer→optimizer 状态机流水线。
    platforms: [claude, codex, dsh]
    repo_affinity:
      - vllm-ascend
      - vllm
    repo_affinity_reason: 流水线围绕 vLLM 昇腾推理服务的部署/寻优/基准/剖析
    skills:
      - environment-install
      - vllm-ascend-serving
      - vllm-memory-calculator
      - vllm-ascend-benchmark
      - vllm-ascend-autotune-zh
      - ascend-profiling-collection
      - ascend-msprof-analyze-cli
      - ascend-perf-tuning
      - cann-package-split-diagnose
      - vllm-ascend-aisbench-accuracy
      - version-bisect
      - dump-debug
    workflow: plugins/inference-model-optimize/workflows/optimize-pipeline.yaml
    # 执行形态：state-machine = 插件自带状态机流水线，路由终点为 workflow 入口
    # （entry_agent），其 skills 仅作各阶段 agent 的知识底座，非路由终点；
    # skills（缺省）= 纯技能聚合，路由终点为单个 skill。
    execution: state-machine
    entry_agent: orchestrator
    agents: [orchestrator, architect, developer, tester, reviewer, optimizer]
    install:
      unit: on-demand
      default_installed: false
      skills_root: skills/inference-model-skills
      install_hint:
        claude: "claude plugin install inference-model-optimize@MindSpeed-Agent"
        codex: "codex plugin add inference-model-optimize@MindSpeed-Agent"
        dsh: "python tools/install-unit.py dsh inference-model-optimize"

  - id: batch-invariance-validation
    name: batch-invariance-validation
    display_name: Batch Invariance Validation
    description: vLLM 昇腾批次不变性验收插件：自动 TP 规划、环境准入、算子分析、功能矩阵和 Math500 十轮验收。
    platforms: [claude, codex, dsh]
    repo_affinity:
      - vllm-ascend
      - vllm
    repo_affinity_reason: 工作流围绕 vLLM 昇腾批次不变性配置、算子包、调度、推理结果和数据集验收
    skills:
      - batch-invariance-validation
      - batch-invariance-environment
      - batch-invariance-operator-analysis
      - batch-invariance-functional-test
      - batch-invariance-dataset-acceptance
    workflow: plugins/batch-invariance-validation/workflows/batch-invariance-validation.yaml
    execution: state-machine
    entry_agent: orchestrator
    agents: [orchestrator, environment-admission, phase1-operator-analysis,
             phase2-functional-validation, phase3-dataset-acceptance]
    install:
      unit: on-demand
      default_installed: false
      skills_root: skills/inference-model-skills/batch-invariance-validation
      install_hint:
        claude: "claude plugin install batch-invariance-validation@MindSpeed-Agent"
        codex: "codex plugin add batch-invariance-validation@MindSpeed-Agent"
        dsh: "python tools/install-unit.py dsh batch-invariance-validation"

